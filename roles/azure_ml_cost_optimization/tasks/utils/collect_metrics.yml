---
# Collect Azure Monitor metrics for compute clusters

- name: Validate required inputs for metrics collection
  ansible.builtin.assert:
    that:
      - _subscription_id is defined
      - _subscription_id | length > 0
      - azure_resource_group is defined
      - azure_resource_group | length > 0
      - azure_ml_cost_optimization_rightsize_analysis_days is defined
      - azure_ml_cost_optimization_rightsize_analysis_days | int > 0
      - _clusters_to_analyze is defined
      - _clusters_to_analyze is iterable
    fail_msg: |
      Missing required inputs for metrics collection:
      _subscription_id: {{ _subscription_id | default('UNDEFINED') }}
      azure_resource_group: {{ azure_resource_group | default('UNDEFINED') }}
      azure_ml_cost_optimization_rightsize_analysis_days: {{ azure_ml_cost_optimization_rightsize_analysis_days | default('UNDEFINED') }}
      _clusters_to_analyze: {{ _clusters_to_analyze | default('UNDEFINED') }}

- name: Set metrics collection parameters
  ansible.builtin.set_fact:
    _metrics_start_time: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(ansible_date_time.epoch | int - (azure_ml_cost_optimization_rightsize_analysis_days * 86400)) }}"
    _metrics_end_time: "{{ ansible_date_time.iso8601 }}"
    _metrics_interval: "PT1H"  # 1 hour granularity

- name: Initialize metrics collection
  ansible.builtin.set_fact:
    _cluster_metrics: []

- name: Collect metrics for each cluster
  ansible.builtin.include_tasks: utils/collect_cluster_metrics.yml
  loop: "{{ _clusters_to_analyze }}"
  loop_control:
    loop_var: cluster_entry
    label: "{{ cluster_entry.cluster_name }}"

- name: Display metrics collection summary
  ansible.builtin.debug:
    msg: |
      Metrics collected for {{ _cluster_metrics | length }} clusters
      Analysis period: {{ azure_ml_cost_optimization_rightsize_analysis_days }} days
